<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gruvs | Find Your Frequency & Discover Local Events</title>
    <meta name="description" content="Discover the best local events, concerts, and exclusive drops. Join The Gruvs to curate your vibe and find your frequency with the most vibrant community.">
    
    <!-- Premium Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <link rel="canonical" href="https://gruvs.com/" />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF4DA6">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <!-- Social Metadata (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gruvs.com/">
    <meta property="og:title" content="The Gruvs | Find Your Frequency">
    <meta property="og:description" content="Join the movement. Curate your vibe, find your crew, and unlock exclusive drops.">
    <meta property="og:image" content="https://gruvs.com/og-image.jpg">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Gruvs | Find Your Frequency">
    <meta name="twitter:description" content="Experience the local frequency.">

    <!-- Structured Data (SEO A to Z) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "The Gruvs",
      "url": "https://gruvs.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://gruvs.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <style>
        :root {
            --primary: #FF4DA6;
            --accent: #00D2FF;
            --dark: #050510;
            --light: #F2F2F2;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
            background: linear-gradient(135deg, rgba(5,5,16,1) 0%, rgba(20,20,40,1) 100%);
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.4;
            filter: grayscale(40%) blur(2px);
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,77,166,0.15) 0%, rgba(5,5,16,0.9) 80%);
            z-index: 2;
        }

        .content {
            position: relative;
            z-index: 10;
            max-width: 800px;
            padding: 20px;
            animation: fadeInStack 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInStack {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 5rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -2px;
            background: linear-gradient(to right, #FFF, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .vibe-tag {
            color: var(--primary);
            font-weight: 600;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            display: block;
        }

        p {
            font-size: 1.5rem;
            line-height: 1.6;
            margin: 30px 0;
            color: rgba(242, 242, 242, 0.8);
            font-weight: 300;
        }

        .cta-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 50px;
        }

        .btn {
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 77, 166, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 77, 166, 0.6);
        }

        .btn-secondary {
            background: var(--glass);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin-top: 80px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 40px;
        }

        .stat-item h3 {
            font-size: 2.5rem;
            margin: 0;
            color: var(--accent);
        }

        .stat-item p {
            font-size: 1rem;
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.5);
        }

        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .cta-container { flex-direction: column; }
            .stat-grid { grid-template-columns: 1fr; gap: 20px; }
        }

        /* Glass Floating Elements */
        .float-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary);
            filter: blur(80px);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 1;
            animation: float 20s infinite alternate;
        }

        @keyframes float {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(20%, 20%); }
        }
    </style>
</head>

<body>
    <div class="float-blob" style="top: 10%; left: 5%;"></div>
    <div class="float-blob" style="bottom: 10%; right: 5%; background: var(--accent);"></div>

    <main class="hero">
        <img class="hero-bg" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=1600&fit=crop" alt="Concert Crowd">
        <div class="hero-overlay"></div>

        <section class="content">
            <span class="vibe-tag">Frequency Found</span>
            <h1>The Gruvs</h1>
            <p>The ultimate social frequency for event discovery. Curate your vibe, find your crew, and unlock access to the city's heartbeat.</p>
            
            <div class="cta-container">
                <a href="/app" class="btn btn-primary">
                    Launch Application
                </a>
                <a href="#discover" class="btn btn-secondary">
                    Explore Drops
                </a>
            </div>

            <div class="stat-grid">
                <div class="stat-item">
                    <h3>50K+</h3>
                    <p>Live Events</p>
                </div>
                <div class="stat-item">
                    <h3>20</h3>
                    <p>Major Cities</p>
                </div>
                <div class="stat-item">
                    <h3>100%</h3>
                    <p>Real Vibe</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Landing Page SW registered'))
                    .catch(err => console.log('Landing Page SW failed', err));
            });
        }
    </script>
</body>

</html>

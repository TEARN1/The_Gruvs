# ⚠ THIS FILE IS NOT DEPLOYED AUTOMATICALLY.
#
# .github/workflows/web-deploy.yml ships only dist/ and then sed-patches the
# config already on the droplet. Nothing ever copies this file up, so editing it
# alone changes NOTHING in production — a change here has to be installed by
# hand (see infra/README or the command below) or it is documentation only.
#
#   scp infra/nginx-thegruvs.conf root@144.126.236.75:/root/thegruvs-nginx-new.conf
#   ssh root@144.126.236.75 'cp /etc/nginx/sites-available/thegruvs /root/thegruvs.bak && \
#     cp /root/thegruvs-nginx-new.conf /etc/nginx/sites-available/thegruvs && \
#     nginx -t && systemctl reload nginx'
#
# Because of that, this file HAD drifted behind the live config — the /share/
# og-meta proxy below was live in production but missing here. Keep them in sync.
server {
    server_name thegruvs.com www.thegruvs.com;

    root /var/www/thegruvs;
    index index.html;

    server_tokens off;          # don't advertise nginx version
    client_max_body_size 10m;   # static site — no large uploads expected

    # Security headers — applied to every response. (NOTE: the asset locations
    # below intentionally use only `expires`/`default_type`, never add_header, so
    # they keep inheriting these — an add_header in a location would drop them.)
    # HSTS is added automatically by certbot once HTTPS is live.
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header X-XSS-Protection       "0"                                always;
    # camera/mic must be (self), not () — an empty allowlist disables them for
    # our OWN origin too, so getUserMedia throws instantly and voice/video calls
    # can never start. (self) allows thegruvs.com while still blocking everyone else.
    add_header Permissions-Policy     "geolocation=(self), camera=(self), microphone=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://feevvddvrjmfbhffccbf.supabase.co wss://feevvddvrjmfbhffccbf.supabase.co https://images.weserv.nl https://nominatim.openstreetmap.org https://api.open-meteo.com https://open.er-api.com https://api.spotify.com https://cdn.jsdelivr.net https://tessdata.projectnaptha.com https://tiles.openfreemap.org; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # nginx's default comp_level is 1 — the weakest setting. Measured on our own
    # bundle: level 1 gives 1,580,490 B, level 6 gives 1,309,024 B. That default
    # was costing every visitor 271 KB for nothing; level 6 is the usual
    # size/CPU sweet spot (7-9 buy <1% more for markedly more CPU per request).
    gzip_comp_level 6;
    # Icon fonts were missing from this list entirely, so MaterialCommunityIcons
    # went out as 1,147,844 uncompressed bytes on every cold load. It compresses
    # to 525,402 — a 622 KB saving, and by far the largest single asset win here.
    # woff2 is deliberately absent: it is already Brotli-compressed internally,
    # so gzipping it burns CPU to make the file slightly bigger.
    gzip_types text/plain text/css application/javascript text/javascript application/json
               image/svg+xml application/manifest+json
               font/ttf application/x-font-ttf application/vnd.ms-fontobject;

    # Deep-link association files have no extension — serve as JSON.
    location /.well-known/ { default_type application/json; try_files $uri =404; }

    # Content-hashed Expo bundles — cache hard. `expires` (not add_header) so the
    # security headers above still apply.
    location /_expo/  { expires 1y;  try_files $uri =404; }
    location /assets/ { expires 30d; try_files $uri =404; }

    # This server's mime.types has no mapping for .ttf, so icon fonts went out as
    # `application/octet-stream` — which meant they matched nothing in gzip_types
    # and shipped uncompressed. Naming the type here is what actually makes the
    # 622 KB font saving above happen; without it that gzip_types line is a no-op.
    # Regex locations beat the /assets/ prefix above, so restate caching: these
    # filenames are content-hashed (…MaterialCommunityIcons.b62641af….ttf), so a
    # year is safe and better than the 30d /assets/ would otherwise give.
    location ~* \.ttf$ {
        default_type font/ttf;
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback (Expo web output: "single").
    # Real Android app (.apk) — must 404 (not fall through to index.html) when
    # absent, so the site can detect whether a build is actually hosted.
    location = /thegruvs.apk {
        alias /var/www/downloads/thegruvs.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="TheGruvs.apk"';
    }

    # Share links -> og-meta edge function. Gives crawlers real per-event HTML
    # ON OUR OWN DOMAIN (indexing the supabase.co copy earns thegruvs.com nothing).
    # The function serves OG tags to crawlers and 302s real users into the SPA.
    location /share/ {
        proxy_pass https://feevvddvrjmfbhffccbf.supabase.co/functions/v1/og-meta/;
        proxy_ssl_server_name on;
        proxy_set_header Host feevvddvrjmfbhffccbf.supabase.co;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        # Edge function down must not break sharing - fall back to the SPA.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }
    location @spa { expires epoch; try_files /index.html =404; }

    location / { expires epoch; try_files $uri $uri/ /index.html; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/thegruvs.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/thegruvs.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.thegruvs.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = thegruvs.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name thegruvs.com www.thegruvs.com;
    return 404; # managed by Certbot




}
# The Resident Crew on V-Gruvs: a Next.js standalone server behind nginx.
# Next sets its own security headers (next.config.ts and src/proxy.ts).
proxy_cache_path /var/cache/nginx/vgruvs/theresident levels=1:2 keys_zone=vgruvs_cache_theresident:10m
                 max_size=512m inactive=7d use_temp_path=off;
include /etc/nginx/vgruvs/upstreams/theresident.conf;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theresidentcrew.com www.theresidentcrew.com;
    server_tokens off;

    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/theresidentcrew.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theresidentcrew.com/privkey.pem;
    include snippets/vgruvs-tls.conf;
    include snippets/vgruvs-gzip.conf;
    include /etc/nginx/vgruvs/apps/theresident.conf;
    include snippets/vgruvs-platform.conf;
    include snippets/vgruvs-acme.conf;

    # Fingerprinted build output, straight from disk. A page that names its
    # release (?dpl=<release>, Next's deploymentId) gets that release's files;
    # then the live release; then the vault of earlier ones (skew protection).
    location /_next/static/ {
        root /srv/vgruvs/theresident/releases/$vgruvs_dpl;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @next_live;
    }
    location @next_live {
        root /srv/vgruvs/theresident/current;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @next_vault;
    }
    location @next_vault {
        root /srv/vgruvs/theresident/vault;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Sign-in and the API get a real per-address limit on top of the app's
    # database-backed lockout. Never cached at the edge.
    location ~ ^/(auth|api)/ {
        limit_req zone=vgruvs_auth burst=10 nodelay;
        proxy_pass http://vgruvs_theresident;
        include snippets/vgruvs-proxy.conf;
    }

    location / {
        proxy_pass http://vgruvs_theresident;
        include snippets/vgruvs-proxy.conf;
        include snippets/vgruvs-edge.conf;
    }
}

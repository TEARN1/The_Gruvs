# Excellency Academy on V-Gruvs: nginx serves the Vite build; everything that
# is not a file goes to the functions runtime, which applies vercel.json's
# rewrites, runs api/*.js, and falls back to index.html.
proxy_cache_path /var/cache/nginx/vgruvs/excellency levels=1:2 keys_zone=vgruvs_cache_excellency:10m
                 max_size=256m inactive=7d use_temp_path=off;
include /etc/nginx/vgruvs/upstreams/excellency.conf;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name excellencyacs.com www.excellencyacs.com;
    server_tokens off;

    root /srv/vgruvs/excellency/current/dist;
    index index.html;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/excellencyacs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/excellencyacs.com/privkey.pem;
    include snippets/vgruvs-tls.conf;
    include snippets/vgruvs-gzip.conf;
    include /etc/nginx/vgruvs/apps/excellency.conf;
    include snippets/vgruvs-platform.conf;
    include snippets/vgruvs-headers.conf;
    include snippets/vgruvs-acme.conf;

    # Vite fingerprints everything under /assets/: safe to cache for a year.
    # Files from an earlier release come from the vault (skew protection).
    location /assets/ {
        include snippets/vgruvs-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri @vault;
    }
    location @vault {
        root /srv/vgruvs/excellency/vault;
        include snippets/vgruvs-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker and the app shell must never be served stale.
    location = /sw.js { expires epoch; try_files $uri =404; }
    location = /index.html { expires epoch; }

    # Functions: a real per-address rate limit (one machine, so it holds).
    location /api/ {
        limit_req zone=vgruvs_api burst=20 nodelay;
        proxy_pass http://vgruvs_excellency;
        include snippets/vgruvs-proxy.conf;
        include snippets/vgruvs-edge.conf;
    }

    # The app shell comes from the app, so a staged rollout covers it too.
    location = / {
        proxy_pass http://vgruvs_excellency;
        include snippets/vgruvs-proxy.conf;
        include snippets/vgruvs-edge.conf;
    }

    location / {
        expires epoch;
        try_files $uri $uri/ @app;
    }

    location @app {
        proxy_pass http://vgruvs_excellency;
        include snippets/vgruvs-proxy.conf;
        include snippets/vgruvs-edge.conf;
    }
}

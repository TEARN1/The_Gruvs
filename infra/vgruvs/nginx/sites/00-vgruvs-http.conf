# V-Gruvs, http level: shared by every app. Loaded first (00-), so the log
# formats, rate-limit zones and maps below exist for every site.

# One JSON line per request, per app: the source for `vgruvs insights`,
# `vgruvs analytics`, the console, the autopilot and rollouts. The path is
# the one the visitor asked for ($uri would say /index.html for /), and
# query strings are never logged (they can carry tokens).
map $request_uri $vgruvs_path {
    "~^(?<vgruvs_p>[^?]*)" $vgruvs_p;
    default "/";
}
log_format vgruvs_json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","h":"$host","m":"$request_method",'
    '"u":"$vgruvs_path","s":$status,"b":$body_bytes_sent,"rt":$request_time,"ut":"$upstream_response_time",'
    '"up":"$upstream_addr","c":"$upstream_cache_status","ref":"$http_referer","ua":"$http_user_agent"}';

# Web Vitals beacons: the page, device class and five numbers. No address.
log_format vgruvs_vitals escape=json '{"t":"$time_iso8601","h":"$host","q":"$args"}';

limit_req_zone $binary_remote_addr zone=vgruvs_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vgruvs_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=vgruvs_vitals:10m rate=2r/s;
# Attack mode (vgruvs shield attack on): every request from one address
# counts; off, the key is empty and nothing is counted.
limit_req_zone $vgruvs_attack_key zone=vgruvs_attack:10m rate=8r/s;
limit_req_status 429;

# Blocked addresses and the attack-mode switch (written by `vgruvs shield`).
include /etc/nginx/vgruvs/http.conf;

# A Next.js page names its release in asset URLs (?dpl=<release>); nginx uses
# it to serve that release's files. Only plain release names are accepted.
map $arg_dpl $vgruvs_dpl {
    "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $arg_dpl;
    default "-";
}

# Port 80 for every V-Gruvs domain: answer certificate challenges, send
# everything else to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    include snippets/vgruvs-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS for a hostname no site claims (a scanner on the bare IP, a forged
# Host header): close the connection. Without this, nginx answers as
# whichever site it loaded first, and that app sees a Host it never expects
# (Excellency's verify function would fetch its page from that host).
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/vgruvs/tls/default.crt;
    ssl_certificate_key /etc/vgruvs/tls/default.key;
    return 444;
}

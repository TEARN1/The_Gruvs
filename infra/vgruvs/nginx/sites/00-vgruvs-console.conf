# The V-Gruvs console, for this machine only. From your computer:
#   ssh -L 9900:127.0.0.1:9900 root@<droplet>     then open http://localhost:9900
# (`vgruvs console publish <domain>` also puts it on the web, behind a password.)
server {
    listen 127.0.0.1:9900;
    server_name _;
    server_tokens off;
    root /srv/vgruvs/_console;
    index index.html;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    location / { try_files $uri $uri/ =404; }
}

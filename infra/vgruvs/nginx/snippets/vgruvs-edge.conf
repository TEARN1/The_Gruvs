# V-Gruvs edge cache, for a location that proxies to an app.
#
# Kept only what the app marks cacheable (Cache-Control: public, s-maxage or
# max-age), and never a response to a request with cookies or a login, so
# nothing personal is ever shared. A stale copy is served while a fresh one
# is fetched (stale-while-revalidate) and while the app is down or failing
# ("always online"). Every release is a new generation: nothing from an old
# release is served after a deploy.
proxy_cache $vgruvs_cache_zone;
proxy_cache_key "$vgruvs_gen|$scheme://$host$request_uri|$http_rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch";
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_revalidate on;
proxy_no_cache $vgruvs_nocache $http_authorization $http_cookie;
proxy_cache_bypass $vgruvs_nocache $http_authorization $http_cookie;

# V-Gruvs platform features, included inside every app's server block.

# Shield: addresses blocked with `vgruvs shield block`, and attack mode.
if ($vgruvs_blocked) { return 403; }
limit_req zone=vgruvs_attack burst=40 nodelay;

# Shield: requests only vulnerability scanners make. The connection is
# closed (444); fail2ban bans an address after three of them.
location ~* "(^|/)(\.env|\.git/|\.svn/|\.hg/|\.aws/|\.ssh/|\.htaccess|\.DS_Store|wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|cgi-bin/|vendor/phpunit)|\.(php[0-9]?|asp|aspx|jsp|cgi)$" {
    return 444;
}

# Speed insights: the beacon script and the endpoint it reports to.
location = /_vgruvs/v.js {
    alias /usr/local/lib/vgruvs/runtime/vitals.js;
    default_type text/javascript;
    expires 1d;
    access_log off;
}
location = /_vgruvs/vitals {
    limit_req zone=vgruvs_vitals burst=20 nodelay;
    access_log /var/log/nginx/vgruvs/vitals.log vgruvs_vitals;
    return 204;
}

# When an app is down and the edge cache has no copy, a friendly page that
# retries by itself instead of nginx's bare 502.
error_page 502 504 /_vgruvs/offline.html;
location = /_vgruvs/offline.html {
    alias /usr/local/lib/vgruvs/pages/offline.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 15 always;
}

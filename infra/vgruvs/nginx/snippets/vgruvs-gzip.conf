gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript text/javascript application/json
           image/svg+xml application/manifest+json application/xml
           font/ttf application/x-font-ttf application/vnd.ms-fontobject;
# Files compressed once at deploy time (vgruvs precompresses releases) are
# sent as they are: smaller than on-the-fly gzip, and no CPU per request.
gzip_static on;
include snippets/vgruvs-brotli.conf;

# Proxying to an app on this machine. X-Forwarded-For is the real client
# address only (not appended to a client-supplied header), so an app's own
# per-IP limits cannot be dodged by sending a fake header.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
# nginx compresses for the visitor; the app answers plain, so the edge cache
# keeps one copy and the Web Vitals tag can be added to its HTML.
proxy_set_header Accept-Encoding "";
proxy_connect_timeout 5s;
proxy_read_timeout 60s;

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back in a moment</title>
<style>
  :root { --bg: #f6f7fb; --fg: #14161f; --muted: #5b6072; --line: #dfe2ec; --accent: #5b5bf0; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0c12; --fg: #eef0f8; --muted: #9aa0b4; --line: #23263a; --accent: #8b8bff; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 30rem; text-align: center; }
  .pulse { width: 56px; height: 56px; margin: 0 auto 28px; border-radius: 50%; border: 2px solid var(--accent); position: relative; }
  .pulse::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: var(--accent); animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(.6); opacity: .5; } 50% { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; } }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 .6rem; text-wrap: balance; }
  p { margin: 0 0 1.4rem; color: var(--muted); }
  button { font: inherit; padding: .65rem 1.3rem; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  small { display: block; margin-top: 2.2rem; color: var(--muted); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <div class="pulse" aria-hidden="true"></div>
  <h1>We'll be right back</h1>
  <p>This page is restarting. It usually takes a few seconds; this page tries again by itself.</p>
  <button type="button" onclick="location.reload()">Try again now</button>
  <small>Served by V-Gruvs</small>
</main>
<script>setTimeout(function () { location.reload(); }, 15000);</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>__DOMAIN__ · Maintenance</title>
<style>
  :root { --bg: #f6f7fb; --fg: #14161f; --muted: #5b6072; --line: #dfe2ec; --accent: #e0861d; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0c12; --fg: #eef0f8; --muted: #9aa0b4; --line: #23263a; --accent: #f3a33d; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 32rem; text-align: center; }
  .stripe { height: 6px; width: 120px; margin: 0 auto 28px; border-radius: 3px;
            background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, transparent 10px 20px); border: 1px solid var(--accent); }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 .6rem; text-wrap: balance; }
  p { margin: 0 0 1.4rem; color: var(--muted); }
  small { display: block; margin-top: 2.2rem; color: var(--muted); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <div class="stripe" aria-hidden="true"></div>
  <h1>Down for maintenance</h1>
  <p>__MESSAGE__</p>
  <small>__DOMAIN__ · Served by V-Gruvs</small>
</main>
<script>setTimeout(function () { location.reload(); }, 60000);</script>
</body>
</html>

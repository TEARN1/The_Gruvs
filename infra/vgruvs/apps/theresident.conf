# The Resident Crew: a Next.js standalone server (output: 'standalone').
APP_TYPE=node
DOMAINS="theresidentcrew.com www.theresidentcrew.com"
PORT_A=3300
PORT_B=3301
# Next answers / with the landing page; a 2xx or 3xx counts as healthy.
HEALTH_PATH=/
KEEP_RELEASES=3
PREVIEW_DOMAIN=

# Skew protection: Next's /_next/static files of earlier releases. With
# NEXT_DEPLOYMENT_ID set at build time (the deploy workflow does), a page
# also gets the exact release it was built with.
SKEW_DIRS="_next/static=.next/static"
SKEW_MAX_AGE_DAYS=7
# Edge cache: pages Next marks cacheable (static and ISR) are served by
# nginx for visitors without a login cookie, and kept online if Next is down.
EDGE_CACHE=on
VITALS=on
# Rolling releases (uses memory for two copies while it runs; best on 1 GB):
#ROLLOUT="20 50"
#ROLLOUT_STEP_SECONDS=120
AUTOPILOT=on
# Crons, e.g. CRONS="0 3 * * * /api/cleanup" (UTC; sent with CRON_SECRET).
CRONS=""

# Excellency Academy: a Vite build in dist/ plus Vercel-style functions in
# api/ and the rewrites in vercel.json, run by the V-Gruvs functions runtime.
APP_TYPE=functions
DOMAINS="excellencyacs.com www.excellencyacs.com"
STATIC_DIR=dist
# Blue/green: the new release starts on the idle port, passes its health
# check, then nginx switches to it.
PORT_A=3200
PORT_B=3201
HEALTH_PATH=/_vgruvs/health
KEEP_RELEASES=5
PREVIEW_DOMAIN=

# Skew protection for Vite's fingerprinted dist/assets.
SKEW_DIRS=assets
SKEW_MAX_AGE_DAYS=7
# Edge cache for responses the functions mark public (e.g. /verify pages).
EDGE_CACHE=on
VITALS=on
# Rolling releases: uncomment to send a new release to 20% of visitors,
# then 50%, then everyone, two minutes apart, judged on real traffic.
#ROLLOUT="20 50"
#ROLLOUT_STEP_SECONDS=120
AUTOPILOT=on
# Vercel-style crons also come from "crons" in vercel.json.
CRONS=""

# Excellency Academy: a Vite build in dist/ plus Vercel-style functions in
# api/ and the rewrites in vercel.json, run by the V-Gruvs functions runtime.
APP_TYPE=functions
DOMAINS="excellencyacs.com www.excellencyacs.com"
STATIC_DIR=dist
# Blue/green: the new release starts on the idle port, passes its health
# check, then nginx switches to it. Only one of these runs at a time.
PORT_A=3200
PORT_B=3201
HEALTH_PATH=/_vgruvs/health
KEEP_RELEASES=5
PREVIEW_DOMAIN=

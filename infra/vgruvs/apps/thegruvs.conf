# The Gruvs: Expo web export, served straight from disk by nginx.
APP_TYPE=static
DOMAINS="thegruvs.com www.thegruvs.com"
# Checked through nginx after every deploy; a failure rolls the deploy back.
HEALTH_PATH=/
KEEP_RELEASES=5
# Branch previews at <name>.preview.thegruvs.com (needs the wildcard DNS
# record and certificate described in the README; leave empty to disable).
PREVIEW_DOMAIN=preview.thegruvs.com

# Skew protection: Expo's fingerprinted bundles and assets stay available
# for this many days after a deploy, so tabs opened earlier keep working.
SKEW_DIRS="_expo assets"
SKEW_MAX_AGE_DAYS=7
# Core Web Vitals from real visitors (vgruvs vitals thegruvs).
VITALS=on
# Watch real traffic for 5 minutes after each deploy; roll back if errors jump.
AUTOPILOT=on

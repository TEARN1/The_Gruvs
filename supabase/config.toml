# Supabase CLI configuration for The Gruvs.
# Links this repo to the live project so `supabase db pull` / `db push` /
# `migration list` work without re-entering the ref each time.
#
# Linking still requires credentials the repo must never contain:
#   supabase login                       # personal access token
#   supabase link --project-ref feevvddvrjmfbhffccbf
# The database password is entered at link time and stored outside the repo.

project_id = "feevvddvrjmfbhffccbf"

[db]
# Must match the live project's engine so a local/shadow DB reproduces it.
major_version = 17

[db.migrations]
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed_global_events.sql"]

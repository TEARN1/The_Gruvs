# ────────────────────────────────────────────────────────────────────────────
# EAS Production Build — Android AAB (Play Store) + iOS (App Store)
# Triggers: pushing a version tag  →  v1.2.3
# Also creates a GitHub Release with the build links attached
# ────────────────────────────────────────────────────────────────────────────
name: EAS Production Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # e.g. v1.2.3

jobs:
  production:
    name: EAS Production (Android AAB + iOS)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build — production (Android)
        id: android
        run: eas build --platform android --profile production --non-interactive --no-wait
        env:
          EXPO_PUBLIC_SUPABASE_URL:          ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY:     ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID:     ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET }}
          EXPO_PUBLIC_YOUTUBE_API_KEY:       ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}

      - name: EAS Build — production (iOS)
        id: ios
        run: eas build --platform ios --profile production --non-interactive --no-wait
        env:
          EXPO_PUBLIC_SUPABASE_URL:          ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY:     ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID:     ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET }}
          EXPO_PUBLIC_YOUTUBE_API_KEY:       ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "The Gruvs ${{ github.ref_name }}"
          body: |
            ## What's new in ${{ github.ref_name }}

            EAS builds are queued — check https://expo.dev/accounts/tearn/projects/the-gruvs/builds for download links.

            **Web:** Auto-deployed to Vercel via the web-deploy workflow.
          generate_release_notes: true

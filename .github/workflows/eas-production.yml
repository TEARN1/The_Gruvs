# ────────────────────────────────────────────────────────────────────────────
# EAS Production Build — Android AAB (Play Store) + iOS (App Store)
#
# Triggers: pushing a semver tag  →  v1.2.3
# Creates a GitHub Release after both builds are queued.
# ────────────────────────────────────────────────────────────────────────────
name: EAS Production Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  # ── Gate: bundle must build before spending production EAS minutes ────────
  check:
    name: Bundle check (production gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Metro bundle check
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL:            ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY:       ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

  production:
    name: EAS Production (Android AAB + iOS)
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v9
        with:
          eas-version: 19.1.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build — production (Android AAB)
        id: android
        run: eas build --platform android --profile production --non-interactive --no-wait
        env:
          EXPO_PUBLIC_SUPABASE_URL:            ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY:       ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID:       ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_YOUTUBE_API_KEY:         ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}

      - name: EAS Build — production (iOS)
        id: ios
        run: eas build --platform ios --profile production --non-interactive --no-wait
        env:
          EXPO_PUBLIC_SUPABASE_URL:            ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY:       ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID:       ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_YOUTUBE_API_KEY:         ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "The Gruvs ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## The Gruvs ${{ github.ref_name }}

            EAS builds are queued on Expo's servers.
            👉 https://expo.dev/accounts/tearn/projects/the-gruvs/builds

            **Web** is auto-deployed via the Web Deploy workflow.

      - name: Write production summary
        if: always()
        run: |
          echo "## Production Build Queued" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Android**: AAB (Play Store)" >> $GITHUB_STEP_SUMMARY
          echo "- **iOS**: IPA (App Store)" >> $GITHUB_STEP_SUMMARY
          echo "- **Track builds**: https://expo.dev/accounts/tearn/projects/the-gruvs/builds" >> $GITHUB_STEP_SUMMARY

name: Weekly Email Digest

on:
  # The weekly schedule is off until the site's /unsubscribe page works and
  # get_weekly_digest_recipients is applied (supabase/queries/weekly_email_digest.sql).
  # Then restore it and set DIGEST_UNSUBSCRIBE_READY below:
  # schedule:
  #   - cron: '0 7 * * 4' # Thursdays 09:00 SAST
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - 'dry-run'
          - 'live-send'
          - 'test-email'
      test_recipient:
        description: 'Test recipient email (only used if mode is test-email)'
        required: false
        default: ''

# The workflow token can only read the code (supply-chain review, Nov 2026).
permissions:
  contents: read

jobs:
  dispatch-digest:
    name: Send 2-Week Upcoming Events Digest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Execute Weekly Digest
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://feevvddvrjmfbhffccbf.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'The Gruvs <vibes@thegruvs.com>' }}
          EXPO_PUBLIC_APP_URL: ${{ secrets.APP_URL || 'https://thegruvs.com' }}
          DIGEST_UNSUBSCRIBE_READY: ${{ vars.DIGEST_UNSUBSCRIBE_READY || 'false' }}
          # Inputs reach the shell as variables, never pasted into the script.
          RUN_MODE: ${{ github.event.inputs.mode }}
          TEST_RECIPIENT: ${{ github.event.inputs.test_recipient }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$RUN_MODE" = "live-send" ]; then
            echo "🚀 Executing live weekly email dispatch..."
            node scripts/send-weekly-digest.mjs --send
          elif [ "$RUN_MODE" = "test-email" ]; then
            echo "Sending a test email..."
            node scripts/send-weekly-digest.mjs --test-email "$TEST_RECIPIENT"
          else
            echo "🔍 Running dry-run verification..."
            node scripts/send-weekly-digest.mjs --dry-run
          fi

# ────────────────────────────────────────────────────────────────────────────
# Web Deploy — Expo web → DigitalOcean droplet (replaces the old Vercel deploy)
#
# CI builds dist/ (validates the bundle), then ships it to the droplet over SSH
# and reloads nginx. Production lives at https://thegruvs.com.
#
# GATED: the deploy job SKIPS cleanly (green) unless the DROPLET_SSH_KEY secret
# is set — so this workflow never fails just because auto-deploy isn't wired up.
#
# To enable auto-deploy on push to main, add these repo secrets:
#   • DROPLET_SSH_KEY  — the private key authorized as root on the droplet
#   • DROPLET_HOST     — (optional) defaults to 144.126.236.75
# ────────────────────────────────────────────────────────────────────────────
name: Web Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # deploy on demand (e.g. after rotating a secret)

jobs:
  # ── Build + validate the web bundle (runs on push AND PR) ─────────────────
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # MUST be `npm run build`, not a bare `expo export`: the postbuild step
      # copies .well-known AND runs scripts/inject-pwa.js, which injects the
      # manifest link + Apple meta + service-worker registration into
      # dist/index.html. Exporting without it ships a build that CANNOT be
      # installed as an app (Chrome never offers "Install").
      - name: Build Expo web (export + PWA injection)
        run: npm run build
        env:
          EXPO_PUBLIC_SUPABASE_URL:          ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY:     ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_FUNCTIONS_URL:         ${{ secrets.EXPO_PUBLIC_FUNCTIONS_URL }}
          EXPO_PUBLIC_APP_URL:               ${{ secrets.EXPO_PUBLIC_APP_URL }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID:     ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET }}
          EXPO_PUBLIC_YOUTUBE_API_KEY:       ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
          retention-days: 1

  # ── Ship to the droplet — only on push to main, only if the key is set ────
  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Guard — skip cleanly if no SSH key is configured
        id: guard
        env:
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::DROPLET_SSH_KEY not set — skipping droplet deploy (add it to enable auto-deploy)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download dist artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: web-dist-${{ github.sha }}
          path: dist/

      - name: Set up SSH
        if: steps.guard.outputs.skip != 'true'
        env:
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${HOST:-144.126.236.75}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ship dist → droplet (staged + atomic swap) + reload nginx
        if: steps.guard.outputs.skip != 'true'
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          TARGET="root@${HOST:-144.126.236.75}"
          # Atomic: extract to a stage dir, then swap with instant renames so the
          # live dir is never empty mid-deploy (avoids the nginx 403 flash).
          ( cd dist && tar czf - . ) | ssh -i ~/.ssh/id_ed25519 "$TARGET" "
            set -e
            rm -rf /var/www/thegruvs_stage && mkdir -p /var/www/thegruvs_stage &&
            tar xzf - -C /var/www/thegruvs_stage &&
            chown -R www-data:www-data /var/www/thegruvs_stage &&
            rm -rf /var/www/thegruvs_old &&
            if [ -d /var/www/thegruvs ]; then mv /var/www/thegruvs /var/www/thegruvs_old; fi &&
            mv /var/www/thegruvs_stage /var/www/thegruvs &&
            CONF=\$(grep -rl 'server_name thegruvs.com' /etc/nginx/ 2>/dev/null | head -1) &&
            { [ -z \"\$CONF\" ] || grep -q 'tiles.openfreemap.org' \"\$CONF\" || sed -i 's#tessdata.projectnaptha.com#tessdata.projectnaptha.com https://tiles.openfreemap.org#' \"\$CONF\"; } &&
            nginx -t && { systemctl reload nginx || systemctl restart nginx; } && systemctl enable nginx 2>/dev/null || true
          "

      - name: Summary
        if: always()
        run: |
          echo "## Web Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Target: https://thegruvs.com (droplet)" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed: ${{ steps.guard.outputs.skip == 'true' && 'skipped (no DROPLET_SSH_KEY)' || 'yes' }}" >> $GITHUB_STEP_SUMMARY

# ────────────────────────────────────────────────────────────────────────────
# Guardian — the app watches itself.
#
# The lesson of the 2026-07 audit: 24 database queries were broken in production
# for months (RSVP, Crews, polls, event chat, and the ticket/QR system that had
# NEVER worked for anyone) and nothing told us, because they fail *silently* —
# the app renders a dead feature as "empty".
#
# So the app now checks itself and RAISES AN ISSUE when it is broken:
#   • schema drift — every live query is run against the real database
#   • health       — the real site is loaded in a real browser and must actually boot
#
# Runs every 6 hours, on every PR (schema only), and on demand.
# ────────────────────────────────────────────────────────────────────────────
name: Guardian

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6h (offset so it isn't on the hour with everyone else)
  pull_request:
    branches: [main]
  # Work here lands as direct pushes, not PRs, so the pull_request trigger above
  # never fired for most changes — drift reached main and was only discovered by
  # the 6-hourly schedule, up to 6 hours later. Catch it at the push instead.
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  schema-drift:
    name: Schema drift (does the code still match the database?)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Audit every live query against the database
        run: node scripts/audit-schema.mjs
        env:
          SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # Fully static (no DB, no secrets) — checks the RENDER layer instead of
      # the data layer: every ErrorBoundary has a label, every React.lazy()
      # render has a local Suspense. This is the exact pair of checks that
      # would have caught the 2026-07-20 incident (an unlabeled root boundary
      # catching a lazy component with no Suspense) before it shipped.
      - name: Audit render-boundary + Suspense contract
        run: node scripts/audit-resilience.mjs

  maintenance:
    name: Maintenance (is the platform still cleaning up after itself?)
    runs-on: ubuntu-latest
    # Schedule-only: retention windows move in days, not commits.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Audit retention + scheduled jobs against the database
        run: node scripts/audit-maintenance.mjs
        env:
          SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

  client-errors:
    name: Client errors (is the app secretly running on fallbacks?)
    runs-on: ubuntu-latest
    # Schedule-only: this reads what real devices reported over the last 24h,
    # which has nothing to do with any individual commit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Audit degraded paths + schema drift reported by clients
        run: node scripts/audit-client-errors.mjs
        env:
          SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

  health:
    name: Health (does the live site actually work?)
    runs-on: ubuntu-latest
    # Only meaningful against production — skip on PRs, and on pushes too. A
    # branch push says nothing about whether the LIVE site boots, and the new
    # push trigger would otherwise run a full browser check on every commit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Load the real site and assert it boots
        run: node scripts/health-check.mjs
        env:
          SITE_URL: https://thegruvs.com

  # If everything is green again, STAND THE ALARM DOWN.
  #
  # Without this the issue only ever opens or gets another "still broken"
  # comment — so it stayed open for days, became wallpaper, and stopped being
  # read. That is the whole reason drift sat in production while the guard was
  # correctly reporting it. An alarm that never turns off is not an alarm.
  # Open issue == broken RIGHT NOW, or the signal is worthless.
  all-clear:
    name: Stand down the alarm
    runs-on: ubuntu-latest
    needs: [schema-drift, maintenance, client-errors, health]
    if: success() && github.event_name == 'schedule'
    steps:
      - name: Close any open Guardian issue
        uses: actions/github-script@v9
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'guardian',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Guardian is green as of ${new Date().toISOString()} — schema matches the database and the live site boots. Closing.\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }

  # If anything above failed on a scheduled run, tell the human. Loudly.
  raise-the-alarm:
    name: Raise an issue
    runs-on: ubuntu-latest
    needs: [schema-drift, maintenance, client-errors, health]
    if: failure() && github.event_name == 'schedule'
    steps:
      - name: Open (or update) an issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = '🔴 Guardian: The Gruvs is broken in production';
            const body = [
              'The scheduled Guardian run **failed**, which means something is broken on the live site.',
              '',
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'One of these is true:',
              '- **Schema drift** — a query no longer matches the database, so a feature is silently dead (this is how RSVP, Crews, polls and tickets broke without anyone noticing).',
              '- **Health** — thegruvs.com does not boot, is throwing errors, or is no longer installable as an app.',
              '',
              'Open the run above for the exact failure.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'guardian',
            });

            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still broken as of ${new Date().toISOString()} — ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['guardian', 'bug'],
              });
            }

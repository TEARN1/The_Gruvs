# ────────────────────────────────────────────────────────────────────────────
# EAS Preview Build — Android APK for internal testing
#
# Only fires when native-relevant files change. Pure JS changes go through
# EAS Update (OTA) instead — no reason to burn EAS build minutes.
#
# Native-relevant: app.json, eas.json, package.json (new native deps),
#                  android/**, ios/**, app.config.js
# ────────────────────────────────────────────────────────────────────────────
name: EAS Preview Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "release/**"
    paths:
      - "app.json"
      - "app.config.js"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "android/**"
      - "ios/**"
      - "plugins/**"

jobs:
  build:
    name: EAS Preview (Android APK)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Quick bundle check before spending EAS build minutes
      - name: Metro bundle check
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL:            ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY:       ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 19.1.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build — preview (Android APK)
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_PUBLIC_SUPABASE_URL:            ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY:       ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID:       ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET:   ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET }}
          EXPO_PUBLIC_YOUTUBE_API_KEY:         ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}

      - name: Write build summary
        if: always()
        run: |
          echo "## EAS Preview Build Queued" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: Android (APK)" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile**: preview" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Track**: https://expo.dev/accounts/tearn/projects/the-gruvs/builds" >> $GITHUB_STEP_SUMMARY

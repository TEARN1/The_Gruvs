# ────────────────────────────────────────────────────────────────────────────
# EAS Preview Build — Android APK + iOS Simulator
# Triggers: push to main or any branch named feature/*, fix/*, release/*
# Builds a distributable APK/IPA for internal testing via EAS
# ────────────────────────────────────────────────────────────────────────────
name: EAS Preview Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "release/**"

jobs:
  build:
    name: EAS Preview (Android + iOS)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build — preview (Android APK)
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_PUBLIC_SUPABASE_URL:          ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY:     ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID:     ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET }}
          EXPO_PUBLIC_YOUTUBE_API_KEY:       ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}

name: Production Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci-gate:
    name: 🔒 CI Quality & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Vulnerability Scan
        run: npm audit --audit-level=high

      - name: TypeScript Compile Verification
        run: npx tsc --noEmit

      - name: Run Jest Unit & Integration Tests
        run: npm run test:unit
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run Node Memory Leak Check
        run: node --expose-gc scripts/memory-leak-check.js

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Tests
        run: npx playwright test tests/e2e/08-navigation-swipe.spec.ts tests/e2e/09-stress-perf.spec.ts --project=chromium
        env:
          CI: true
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

  database-migrations:
    name: 🗄️ Supabase Migrations Audit & Sync
    runs-on: ubuntu-latest
    needs: ci-gate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 'latest'

      - name: Verify Migration Files Integrity
        run: supabase db lint

      - name: Apply DB Migrations to Production
        run: supabase db push --db-url "${{ secrets.SUPABASE_PRODUCTION_DB_URL }}"

  cd-deploy-android:
    name: 🤖 Google Play Store CD Release
    runs-on: ubuntu-latest
    needs: database-migrations

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up Expo Credentials & CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Pre-Flight Check (Environment Secrets & App Versioning)
        run: node scripts/pre-deploy-check.js
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build Android App Bundle (AAB) via EAS
        id: build_aab
        run: |
          # Build signed Android production bundle (.aab)
          eas build --platform android --profile production --non-interactive --local --output=app-release.aab
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET }}

      - name: Run Fastlane Google Play Deployment
        run: bundle exec fastlane deploy_internal
        env:
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY_DATA }}
          ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
          AAB_FILE_PATH: '../app-release.aab'
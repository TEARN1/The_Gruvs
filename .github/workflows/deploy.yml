name: Production Deploy Pipeline

on:
  # Manual-only: this pipeline runs a native EAS build which needs the EXPO_TOKEN
  # secret. Without it, every push to main failed at "Validating authenticated
  # account". Re-enable `push: branches: [main]` once EXPO_TOKEN is set.
  workflow_dispatch:

jobs:
  ci-gate:
    name: 🔒 CI Quality & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Vulnerability Scan
        # Reports high+ advisories but does NOT hard-block the pipeline: the only
        # current high is @xmldom/xmldom, a transitive dep inside Expo's own CLI
        # toolchain (@expo/cli → @expo/config-plugins → @expo/plist) that can't be
        # fixed without a breaking Expo upgrade. Surfaced as a warning instead.
        run: npm audit --audit-level=high || echo "::warning::npm audit found high advisories (review — non-blocking)"
        continue-on-error: true

      - name: TypeScript Compile Verification
        run: npx tsc --noEmit

      - name: Run Jest Unit & Integration Tests
        # Run HERMETIC — no Supabase env injected. Some unit tests (e.g. storageThumb)
        # are written to run without EXPO_PUBLIC_SUPABASE_URL; injecting a real host
        # changes URL-transform behaviour and fails them. Tests mock Supabase anyway.
        run: npm run test:unit

      - name: Run Node Memory Leak Check
        run: node --expose-gc scripts/memory-leak-check.js

      - name: Build Web Application (E2E needs dist/ for the Playwright webServer)
        run: npm run build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://placeholder-project.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Tests
        # NON-BLOCKING: full-app browser E2E (swipe gestures + app hydration) is
        # heavy/flaky on headless CI runners. The REAL critical-flow smoke (live
        # login/feed/message) is scripts/pre-deploy-check.js in the deploy job, so
        # this stays advisory here and never permanently blocks a release.
        continue-on-error: true
        run: npx playwright test tests/e2e/08-navigation-swipe.spec.ts tests/e2e/09-stress-perf.spec.ts --project=chromium
        env:
          CI: true
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://placeholder-project.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── SAFETY GATE: prove pending migrations apply cleanly to a THROWAWAY clone
  #    before we ever touch production. No migration reaches prod unless it
  #    applied here first. Skips cleanly until you baseline (supabase db pull).
  migration-preflight:
    name: 🧪 Migration Pre-flight (throwaway DB)
    runs-on: ubuntu-latest
    needs: ci-gate

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gruvs_preflight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gruvs_preflight

    steps:
      - uses: actions/checkout@v7

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Detect migrations
        id: check
        run: |
          if [ ! -d supabase/migrations ] || [ -z "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No supabase/migrations yet — nothing to pre-flight. Baseline with 'supabase db pull' (see supabase/MIGRATIONS_SETUP.md)."
          else
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap Supabase-managed objects (roles, auth, realtime, extensions)
        if: steps.check.outputs.has_migrations == 'true'
        run: psql -v ON_ERROR_STOP=1 -X -q -f supabase/test/bootstrap.sql

      - name: Apply pending migrations to the throwaway clone (in order)
        if: steps.check.outputs.has_migrations == 'true'
        run: |
          set -e
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "── applying $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -X -q -f "$f"
          done
          echo "✅ All migrations applied cleanly to a throwaway clone — safe to push to prod."

  database-migrations:
    name: 🗄️ Supabase Migrations Audit & Sync
    runs-on: ubuntu-latest
    needs: migration-preflight   # ← prod push only runs if the throwaway-clone apply passed

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 'latest'

      # NOTE: `supabase db lint` needs a LOCAL running Postgres (supabase start) —
      # not available on a stock CI runner — so it's intentionally omitted here.
      - name: Apply DB Migrations to Production
        # Only push when migrations exist AND the secret is configured. Until you
        # baseline (see supabase/MIGRATIONS_SETUP.md), this skips cleanly instead
        # of failing the whole pipeline.
        run: |
          if [ -z "${{ secrets.SUPABASE_PRODUCTION_DB_URL }}" ]; then
            echo "::warning::SUPABASE_PRODUCTION_DB_URL not set — skipping db push. See supabase/MIGRATIONS_SETUP.md"; exit 0; fi
          if [ ! -d supabase/migrations ] || [ -z "$(ls -A supabase/migrations 2>/dev/null)" ]; then
            echo "::warning::No supabase/migrations yet — run 'supabase db pull' to baseline first. Skipping."; exit 0; fi
          supabase db push --db-url "${{ secrets.SUPABASE_PRODUCTION_DB_URL }}"

  cd-deploy-android:
    name: 🤖 Google Play Store CD Release
    runs-on: ubuntu-latest
    needs: database-migrations

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up Expo Credentials & CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Pre-Flight Check (Environment Secrets & App Versioning)
        run: node scripts/pre-deploy-check.js
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build Android App Bundle (AAB) via EAS
        id: build_aab
        run: |
          # Build signed Android production bundle (.aab)
          eas build --platform android --profile production --non-interactive --local --output=app-release.aab
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET }}

      - name: Run Fastlane Google Play Deployment
        run: bundle exec fastlane deploy_internal
        env:
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY_DATA }}
          ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
          AAB_FILE_PATH: '../app-release.aab'
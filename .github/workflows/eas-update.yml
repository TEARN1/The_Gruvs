# ────────────────────────────────────────────────────────────────────────────
# EAS Update — OTA (over-the-air) JS bundle push
# Triggers: push to main
# Pushes a JS-only update instantly to all users on the production channel
# without requiring a new App Store / Play Store submission
# ────────────────────────────────────────────────────────────────────────────
name: EAS Update (OTA)

on:
  push:
    branches: [main]

jobs:
  update:
    name: Push OTA update
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        run: |
          eas update \
            --branch production \
            --message "OTA: ${{ github.event.head_commit.message }}" \
            --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL:          ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY:     ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID:     ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET }}
          EXPO_PUBLIC_YOUTUBE_API_KEY:       ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}

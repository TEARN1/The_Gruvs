# ────────────────────────────────────────────────────────────────────────────
# EAS Update — OTA (over-the-air) JS bundle push
#
# GATED: Metro bundle check must pass before any OTA is pushed.
# A broken OTA reaching production users is worse than a delayed one.
#
# Triggers: push to main only
# ────────────────────────────────────────────────────────────────────────────
name: EAS Update (OTA)

on:
  # Manual-only: OTA updates need the EXPO_TOKEN secret. Re-enable
  # `push: branches: [main]` once EXPO_TOKEN is set in repo secrets.
  workflow_dispatch:

jobs:
  # ── Gate: Metro bundle must build cleanly ────────────────────────────────
  check:
    name: Bundle check (OTA gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Metro bundle check
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL:            ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY:       ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID:       ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET:   ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET }}
          EXPO_PUBLIC_YOUTUBE_API_KEY:         ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}

  # ── OTA push — only if bundle check passes ───────────────────────────────
  update:
    name: Push OTA update
    runs-on: ubuntu-latest
    needs: check           # ← GATE: skipped entirely if check fails

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v9
        with:
          eas-version: 19.1.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        id: ota
        run: |
          eas update \
            --branch production \
            --message "${{ github.event.head_commit.message }}" \
            --non-interactive \
            --json 2>&1 | tee ota-out.txt
        env:
          EXPO_PUBLIC_SUPABASE_URL:            ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY:       ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID:       ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET:   ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET }}
          EXPO_PUBLIC_YOUTUBE_API_KEY:         ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}

      - name: Write OTA summary
        if: always()
        run: |
          echo "## OTA Update" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: production" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY

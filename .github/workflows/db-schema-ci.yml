# ────────────────────────────────────────────────────────────────────────────
# DB SCHEMA CI — builds the schema on a throwaway Postgres on every push.
#
# WHY: this is the safety rail from ROADMAP.md / MIGRATIONS_SETUP.md. It proves
# the schema builds CLEANLY from empty before anything reaches the live DB, and
# catches the shape/order/idempotency bugs (missing columns, view clashes,
# duplicate functions, forward references) that have bitten when replaying the
# files by hand. Runs in isolation — does NOT touch production and does NOT gate
# deploy.yml; a red run here is an advisory "the schema won't build fresh."
#
# Order matters: the consolidated files are NOT topologically sorted. The base
# schema (13_schema_v5) lives in part_2, so the correct fresh-build order is
# part_2 → part_3 → part_4 → part_1. See supabase/queries/FRESH_BUILD_ORDER.md.
#
# Once `supabase/migrations/` is baselined, add a second job that applies the
# migrations to this same throwaway DB — that becomes the real per-PR gate.
# ────────────────────────────────────────────────────────────────────────────
name: DB Schema CI

on:
  push:
    branches: ["**"]
    paths: ["supabase/queries/**", "supabase/test/**", ".github/workflows/db-schema-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["supabase/queries/**", "supabase/test/**"]

jobs:
  build-schema:
    name: Build schema on throwaway Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gruvs_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gruvs_ci
      PSQL: "psql -v ON_ERROR_STOP=1 -X -q"

    steps:
      - uses: actions/checkout@v7

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap Supabase-managed objects (roles, auth, realtime)
        run: $PSQL -f supabase/test/bootstrap.sql

      # Fresh-build order: 2 → 3 → 4 → 1 (base schema lives in part_2).
      - name: Apply schema_part_2 (base + v5)
        run: $PSQL -f supabase/queries/schema_part_2.sql

      - name: Apply schema_part_3 (sports / talent)
        run: $PSQL -f supabase/queries/schema_part_3.sql

      - name: Apply schema_part_4 (governance / patches)
        run: $PSQL -f supabase/queries/schema_part_4.sql

      - name: Apply schema_part_1 (extras — push, ai, business)
        run: $PSQL -f supabase/queries/schema_part_1.sql

      # Applied to production 2026-07-13. A freshly built database MUST end up
      # matching production, or the schema files quietly stop being a usable
      # rebuild — and the drift they fix (event_rsvps.id, which the whole ticket
      # / QR check-in system keys on) silently comes back.
      - name: Apply schema_drift_fixes (tickets, activity feed, crew FKs)
        run: $PSQL -f supabase/queries/schema_drift_fixes.sql

      # ── The gap this closes (2026-08-18 Phase-0 pass) ──────────────────────
      # This job had been frozen at schema_drift_fixes.sql since 2026-07-13.
      # 49 more .sql files were applied to production since — meaning CI had
      # been proving a schema that no longer matched what was actually live,
      # exactly the false confidence Phase 0 exists to remove. Adding back the
      # ones already confirmed idempotent and safe to replay: RUN_IN_SUPABASE
      # (bundles the follow/stories, reels, and competition-engine fixes) and
      # APPLY_LIVE_FIXES, both explicitly written "safe to run, and safe to run
      # again." The remaining ~35 files (map_zones, messages_*, resident_*,
      # security_layers, etc.) are NOT yet added here — each needs a real read
      # for ordering/dependencies rather than a guess, tracked in ROADMAP.md.
      - name: Apply RUN_IN_SUPABASE (follow/stories, reels, competition engine)
        run: $PSQL -f supabase/queries/RUN_IN_SUPABASE.sql

      - name: Apply APPLY_LIVE_FIXES
        run: $PSQL -f supabase/queries/APPLY_LIVE_FIXES.sql

      # This session's own migrations — written, applied, and verified live
      # already (see RISK_REGISTER.md / commit history 2026-08-18).
      - name: Apply business_invoice_requests
        run: $PSQL -f supabase/queries/business_invoice_requests.sql

      - name: Apply maintenance_l1_column_drift_fix
        run: $PSQL -f supabase/queries/maintenance_l1_column_drift_fix.sql

      - name: Apply founder_alerts_and_lockdown
        run: $PSQL -f supabase/queries/founder_alerts_and_lockdown.sql

      - name: Apply event_info_and_session_reminders
        run: $PSQL -f supabase/queries/event_info_and_session_reminders.sql

      # Re-run part 4's idempotent patch tail to prove idempotency (safe re-run).
      - name: Re-apply schema_part_4 (idempotency check)
        run: $PSQL -f supabase/queries/schema_part_4.sql

      # And prove the drift fixes are idempotent too.
      - name: Re-apply schema_drift_fixes (idempotency check)
        run: $PSQL -f supabase/queries/schema_drift_fixes.sql

      # And the newly-added ones — all four claim to be safe to re-run.
      - name: Re-apply RUN_IN_SUPABASE (idempotency check)
        run: $PSQL -f supabase/queries/RUN_IN_SUPABASE.sql

      - name: Re-apply APPLY_LIVE_FIXES (idempotency check)
        run: $PSQL -f supabase/queries/APPLY_LIVE_FIXES.sql

      - name: Re-apply business_invoice_requests (idempotency check)
        run: $PSQL -f supabase/queries/business_invoice_requests.sql

      - name: Re-apply maintenance_l1_column_drift_fix (idempotency check)
        run: $PSQL -f supabase/queries/maintenance_l1_column_drift_fix.sql

      - name: Re-apply founder_alerts_and_lockdown (idempotency check)
        run: $PSQL -f supabase/queries/founder_alerts_and_lockdown.sql

      - name: Re-apply event_info_and_session_reminders (idempotency check)
        run: $PSQL -f supabase/queries/event_info_and_session_reminders.sql

      - name: Summary
        if: always()
        run: |
          echo "## DB Schema CI" >> $GITHUB_STEP_SUMMARY
          echo "Built schema on throwaway Postgres in fresh-build order (2→3→4→1)." >> $GITHUB_STEP_SUMMARY
          echo "A green run means the consolidated schema builds cleanly from empty." >> $GITHUB_STEP_SUMMARY
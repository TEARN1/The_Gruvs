# ────────────────────────────────────────────────────────────────────────────
# DB SCHEMA CI — builds the schema on a throwaway Postgres on every push.
#
# WHY: this is the safety rail from ROADMAP.md / MIGRATIONS_SETUP.md. It proves
# the schema builds CLEANLY from empty before anything reaches the live DB, and
# catches the shape/order/idempotency bugs (missing columns, view clashes,
# duplicate functions, forward references) that have bitten when replaying the
# files by hand. Runs in isolation — does NOT touch production and does NOT gate
# deploy.yml; a red run here is an advisory "the schema won't build fresh."
#
# Order matters: the consolidated files are NOT topologically sorted. The base
# schema (13_schema_v5) lives in part_2, so the correct fresh-build order is
# part_2 → part_3 → part_4 → part_1. See supabase/queries/FRESH_BUILD_ORDER.md.
#
# Once `supabase/migrations/` is baselined, add a second job that applies the
# migrations to this same throwaway DB — that becomes the real per-PR gate.
# ────────────────────────────────────────────────────────────────────────────
name: DB Schema CI

on:
  push:
    branches: ["**"]
    paths: ["supabase/queries/**", "supabase/test/**", ".github/workflows/db-schema-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["supabase/queries/**", "supabase/test/**"]

jobs:
  build-schema:
    name: Build schema on throwaway Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gruvs_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gruvs_ci
      PSQL: "psql -v ON_ERROR_STOP=1 -X -q"

    steps:
      - uses: actions/checkout@v7

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap Supabase-managed objects (roles, auth, realtime)
        run: $PSQL -f supabase/test/bootstrap.sql

      # Fresh-build order: 2 → 3 → 4 → 1 (base schema lives in part_2).
      - name: Apply schema_part_2 (base + v5)
        run: $PSQL -f supabase/queries/schema_part_2.sql

      - name: Apply schema_part_3 (sports / talent)
        run: $PSQL -f supabase/queries/schema_part_3.sql

      - name: Apply schema_part_4 (governance / patches)
        run: $PSQL -f supabase/queries/schema_part_4.sql

      - name: Apply schema_part_1 (extras — push, ai, business)
        run: $PSQL -f supabase/queries/schema_part_1.sql

      # Applied to production 2026-07-13. A freshly built database MUST end up
      # matching production, or the schema files quietly stop being a usable
      # rebuild — and the drift they fix (event_rsvps.id, which the whole ticket
      # / QR check-in system keys on) silently comes back.
      - name: Apply schema_drift_fixes (tickets, activity feed, crew FKs)
        run: $PSQL -f supabase/queries/schema_drift_fixes.sql

      # ── The gap this closes (2026-08-18 Phase-0 pass) ──────────────────────
      # This job had been frozen at schema_drift_fixes.sql since 2026-07-13.
      # 49 more .sql files were applied to production since — meaning CI had
      # been proving a schema that no longer matched what was actually live,
      # exactly the false confidence Phase 0 exists to remove. Adding back the
      # ones already confirmed idempotent and safe to replay: RUN_IN_SUPABASE
      # (bundles the follow/stories, reels, and competition-engine fixes) and
      # APPLY_LIVE_FIXES, both explicitly written "safe to run, and safe to run
      # again."
      - name: Apply RUN_IN_SUPABASE (follow/stories, reels, competition engine)
        run: $PSQL -f supabase/queries/RUN_IN_SUPABASE.sql

      - name: Apply APPLY_LIVE_FIXES
        run: $PSQL -f supabase/queries/APPLY_LIVE_FIXES.sql

      # This session's own migrations — written, applied, and verified live
      # already (see RISK_REGISTER.md / commit history 2026-08-18).
      - name: Apply business_invoice_requests
        run: $PSQL -f supabase/queries/business_invoice_requests.sql

      - name: Apply maintenance_l1_column_drift_fix
        run: $PSQL -f supabase/queries/maintenance_l1_column_drift_fix.sql

      - name: Apply founder_alerts_and_lockdown
        run: $PSQL -f supabase/queries/founder_alerts_and_lockdown.sql

      - name: Apply event_info_and_session_reminders
        run: $PSQL -f supabase/queries/event_info_and_session_reminders.sql

      # ── Batch 2 (2026-08-18) — dependency order verified by reading each
      # file's own header, not guessed. Idempotency spot-checked: every
      # INSERT INTO in this batch is inside a function body (runtime, not
      # file-replay time); every CREATE TABLE uses IF NOT EXISTS.
      - name: Apply map_zones (Living Map spine)
        run: $PSQL -f supabase/queries/map_zones.sql

      - name: Apply resident_schema_v2 (Resident base schema — res_* tables)
        run: $PSQL -f supabase/queries/resident_schema_v2.sql

      # Depends on map_zones (inserts into it) + resident_schema_v2 (res_profiles).
      - name: Apply res_map_bridge (Gruvs <-> Resident identity bridge)
        run: $PSQL -f supabase/queries/res_map_bridge.sql

      # Depends on resident_schema_v2's res_profiles.
      - name: Apply resident_trust_bridge
        run: $PSQL -f supabase/queries/resident_trust_bridge.sql

      # Depends on resident_trust_bridge's res_sync_trust().
      - name: Apply resident_marketplace_gate
        run: $PSQL -f supabase/queries/resident_marketplace_gate.sql

      - name: Apply resident_traffic_reports
        run: $PSQL -f supabase/queries/resident_traffic_reports.sql

      # messages_reactions_hardening + messages_video_type both reference
      # objects (guard_message_update, send_message_v2) defined here.
      - name: Apply messages_send_hardening
        run: $PSQL -f supabase/queries/messages_send_hardening.sql

      - name: Apply messages_reactions_hardening
        run: $PSQL -f supabase/queries/messages_reactions_hardening.sql

      - name: Apply messages_video_type
        run: $PSQL -f supabase/queries/messages_video_type.sql

      - name: Apply messages_block_gate
        run: $PSQL -f supabase/queries/messages_block_gate.sql

      - name: Apply event_chat_hardening
        run: $PSQL -f supabase/queries/event_chat_hardening.sql

      - name: Apply event_drafts
        run: $PSQL -f supabase/queries/event_drafts.sql

      # Depends on event_drafts' draft table.
      - name: Apply event_draft_tasks
        run: $PSQL -f supabase/queries/event_draft_tasks.sql

      # Revokes/hardens against everything above — deliberately last in this
      # batch so nothing it references is still undefined.
      - name: Apply security_layers
        run: $PSQL -f supabase/queries/security_layers.sql

      # ── Batch 3 (2026-08-18) ────────────────────────────────────────────────
      # schema_v6_proposed.sql / schema_v6_idempotent.sql deliberately EXCLUDED:
      # the proposal file says outright "NOT applied to the live database, do
      # NOT run this as-is" — including it would build a schema that doesn't
      # match production, the opposite of what this job proves.
      - name: Apply schema_drift_columns
        run: $PSQL -f supabase/queries/schema_drift_columns.sql

      - name: Apply fix_series_fk
        run: $PSQL -f supabase/queries/fix_series_fk.sql

      - name: Apply tour_series
        run: $PSQL -f supabase/queries/tour_series.sql

      - name: Apply fix_crew_invite_rls_recursion
        run: $PSQL -f supabase/queries/fix_crew_invite_rls_recursion.sql

      # These three still create needed objects (profiles_within_radius,
      # get_my_profile) — only their inline grant/regrant logic is superseded,
      # by profiles_grants_reconciled.sql immediately after. Real security bug
      # found and fixed here 2026-08-18: the three files' grant lists didn't
      # compose, and had left email/push_token/phone/emergency_contacts/
      # siblings readable cross-user in production. See RISK_REGISTER.md C11.
      - name: Apply lock_profile_coordinates
        run: $PSQL -f supabase/queries/lock_profile_coordinates.sql

      - name: Apply lock_authenticated_pii
        run: $PSQL -f supabase/queries/lock_authenticated_pii.sql

      - name: Apply regrant_profile_columns
        run: $PSQL -f supabase/queries/regrant_profile_columns.sql

      - name: Apply profiles_grants_reconciled (authoritative final grant)
        run: $PSQL -f supabase/queries/profiles_grants_reconciled.sql

      - name: Apply home_area
        run: $PSQL -f supabase/queries/home_area.sql

      - name: Apply checkin_verification
        run: $PSQL -f supabase/queries/checkin_verification.sql

      # Depends on resident_trust_bridge (batch 2) for res_sync_trust().
      - name: Apply verification_engine
        run: $PSQL -f supabase/queries/verification_engine.sql

      - name: Apply vibe_equity_column
        run: $PSQL -f supabase/queries/vibe_equity_column.sql

      - name: Apply username_skeleton
        run: $PSQL -f supabase/queries/username_skeleton.sql

      - name: Apply sso_handoff
        run: $PSQL -f supabase/queries/sso_handoff.sql

      - name: Apply web_push
        run: $PSQL -f supabase/queries/web_push.sql

      - name: Apply private_chat_media
        run: $PSQL -f supabase/queries/private_chat_media.sql

      - name: Apply boosted_slot
        run: $PSQL -f supabase/queries/boosted_slot.sql

      # maintenance_levels references data_retention's purge functions.
      - name: Apply data_retention
        run: $PSQL -f supabase/queries/data_retention.sql

      - name: Apply maintenance_levels
        run: $PSQL -f supabase/queries/maintenance_levels.sql

      - name: Apply maintenance_status
        run: $PSQL -f supabase/queries/maintenance_status.sql

      # Self-contained (creates res_distance_m from scratch) — confirmed by
      # reading the full file, not just its header, after an earlier grep
      # mistake made it look undefined elsewhere.
      - name: Apply pin_res_distance_m_search_path
        run: $PSQL -f supabase/queries/pin_res_distance_m_search_path.sql

      - name: Apply definer_views_audit
        run: $PSQL -f supabase/queries/definer_views_audit.sql

      # Already applied + verified live earlier this session — see
      # RISK_REGISTER.md C2. Re-adding here so CI proves it too.
      - name: Apply advisor_hardening_2026-08-13
        run: $PSQL -f supabase/queries/advisor_hardening_2026-08-13.sql

      # Broad purge across most feature tables — deliberately last in this
      # batch, same reasoning as security_layers in batch 2.
      - name: Apply account_deletion
        run: $PSQL -f supabase/queries/account_deletion.sql

      # Re-run part 4's idempotent patch tail to prove idempotency (safe re-run).
      - name: Re-apply schema_part_4 (idempotency check)
        run: $PSQL -f supabase/queries/schema_part_4.sql

      # And prove the drift fixes are idempotent too.
      - name: Re-apply schema_drift_fixes (idempotency check)
        run: $PSQL -f supabase/queries/schema_drift_fixes.sql

      # And the newly-added ones — all four claim to be safe to re-run.
      - name: Re-apply RUN_IN_SUPABASE (idempotency check)
        run: $PSQL -f supabase/queries/RUN_IN_SUPABASE.sql

      - name: Re-apply APPLY_LIVE_FIXES (idempotency check)
        run: $PSQL -f supabase/queries/APPLY_LIVE_FIXES.sql

      - name: Re-apply business_invoice_requests (idempotency check)
        run: $PSQL -f supabase/queries/business_invoice_requests.sql

      - name: Re-apply maintenance_l1_column_drift_fix (idempotency check)
        run: $PSQL -f supabase/queries/maintenance_l1_column_drift_fix.sql

      - name: Re-apply founder_alerts_and_lockdown (idempotency check)
        run: $PSQL -f supabase/queries/founder_alerts_and_lockdown.sql

      - name: Re-apply event_info_and_session_reminders (idempotency check)
        run: $PSQL -f supabase/queries/event_info_and_session_reminders.sql

      - name: Re-apply map_zones (idempotency check)
        run: $PSQL -f supabase/queries/map_zones.sql

      - name: Re-apply resident_schema_v2 (idempotency check)
        run: $PSQL -f supabase/queries/resident_schema_v2.sql

      - name: Re-apply res_map_bridge (idempotency check)
        run: $PSQL -f supabase/queries/res_map_bridge.sql

      - name: Re-apply resident_trust_bridge (idempotency check)
        run: $PSQL -f supabase/queries/resident_trust_bridge.sql

      - name: Re-apply resident_marketplace_gate (idempotency check)
        run: $PSQL -f supabase/queries/resident_marketplace_gate.sql

      - name: Re-apply resident_traffic_reports (idempotency check)
        run: $PSQL -f supabase/queries/resident_traffic_reports.sql

      - name: Re-apply messages_send_hardening (idempotency check)
        run: $PSQL -f supabase/queries/messages_send_hardening.sql

      - name: Re-apply messages_reactions_hardening (idempotency check)
        run: $PSQL -f supabase/queries/messages_reactions_hardening.sql

      - name: Re-apply messages_video_type (idempotency check)
        run: $PSQL -f supabase/queries/messages_video_type.sql

      - name: Re-apply messages_block_gate (idempotency check)
        run: $PSQL -f supabase/queries/messages_block_gate.sql

      - name: Re-apply event_chat_hardening (idempotency check)
        run: $PSQL -f supabase/queries/event_chat_hardening.sql

      - name: Re-apply event_drafts (idempotency check)
        run: $PSQL -f supabase/queries/event_drafts.sql

      - name: Re-apply event_draft_tasks (idempotency check)
        run: $PSQL -f supabase/queries/event_draft_tasks.sql

      - name: Re-apply security_layers (idempotency check)
        run: $PSQL -f supabase/queries/security_layers.sql

      - name: Re-apply schema_drift_columns (idempotency check)
        run: $PSQL -f supabase/queries/schema_drift_columns.sql

      - name: Re-apply fix_series_fk (idempotency check)
        run: $PSQL -f supabase/queries/fix_series_fk.sql

      - name: Re-apply tour_series (idempotency check)
        run: $PSQL -f supabase/queries/tour_series.sql

      - name: Re-apply fix_crew_invite_rls_recursion (idempotency check)
        run: $PSQL -f supabase/queries/fix_crew_invite_rls_recursion.sql

      - name: Re-apply lock_profile_coordinates (idempotency check)
        run: $PSQL -f supabase/queries/lock_profile_coordinates.sql

      - name: Re-apply lock_authenticated_pii (idempotency check)
        run: $PSQL -f supabase/queries/lock_authenticated_pii.sql

      - name: Re-apply regrant_profile_columns (idempotency check)
        run: $PSQL -f supabase/queries/regrant_profile_columns.sql

      - name: Re-apply profiles_grants_reconciled (idempotency check)
        run: $PSQL -f supabase/queries/profiles_grants_reconciled.sql

      - name: Re-apply home_area (idempotency check)
        run: $PSQL -f supabase/queries/home_area.sql

      - name: Re-apply checkin_verification (idempotency check)
        run: $PSQL -f supabase/queries/checkin_verification.sql

      - name: Re-apply verification_engine (idempotency check)
        run: $PSQL -f supabase/queries/verification_engine.sql

      - name: Re-apply vibe_equity_column (idempotency check)
        run: $PSQL -f supabase/queries/vibe_equity_column.sql

      - name: Re-apply username_skeleton (idempotency check)
        run: $PSQL -f supabase/queries/username_skeleton.sql

      - name: Re-apply sso_handoff (idempotency check)
        run: $PSQL -f supabase/queries/sso_handoff.sql

      - name: Re-apply web_push (idempotency check)
        run: $PSQL -f supabase/queries/web_push.sql

      - name: Re-apply private_chat_media (idempotency check)
        run: $PSQL -f supabase/queries/private_chat_media.sql

      - name: Re-apply boosted_slot (idempotency check)
        run: $PSQL -f supabase/queries/boosted_slot.sql

      - name: Re-apply data_retention (idempotency check)
        run: $PSQL -f supabase/queries/data_retention.sql

      - name: Re-apply maintenance_levels (idempotency check)
        run: $PSQL -f supabase/queries/maintenance_levels.sql

      - name: Re-apply maintenance_status (idempotency check)
        run: $PSQL -f supabase/queries/maintenance_status.sql

      - name: Re-apply pin_res_distance_m_search_path (idempotency check)
        run: $PSQL -f supabase/queries/pin_res_distance_m_search_path.sql

      - name: Re-apply definer_views_audit (idempotency check)
        run: $PSQL -f supabase/queries/definer_views_audit.sql

      - name: Re-apply advisor_hardening_2026-08-13 (idempotency check)
        run: $PSQL -f supabase/queries/advisor_hardening_2026-08-13.sql

      - name: Re-apply account_deletion (idempotency check)
        run: $PSQL -f supabase/queries/account_deletion.sql

      - name: Summary
        if: always()
        run: |
          echo "## DB Schema CI" >> $GITHUB_STEP_SUMMARY
          echo "Built schema on throwaway Postgres in fresh-build order (2→3→4→1)." >> $GITHUB_STEP_SUMMARY
          echo "A green run means the consolidated schema builds cleanly from empty." >> $GITHUB_STEP_SUMMARY
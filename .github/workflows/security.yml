name: Security

# Secret scanning (#923). Blocks the build if a real secret is ever committed —
# the backstop for the close calls this repo has had (an APK in history, .env
# handling). Public-by-design values (the Supabase anon key, the VAPID public
# key, token-shaped test fixtures) are allowlisted in .gitleaks.toml. Runs the
# gitleaks CLI directly (MIT-licensed) — no marketplace action, no licence key.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run gitleaks
        run: |
          set -euo pipefail
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks

          # `detect --no-git` scans the working tree (current files), not full
          # history — catches any secret present now without failing forever on
          # old commits. --redact keeps any match out of the logs.
          #
          # BLOCKING: --exit-code 1 fails the job on a finding. Validated against
          # this tree — the only two hits were the VAPID *public* key and the
          # logger-scrubbing test fixtures, both now allowlisted in
          # .gitleaks.toml, so a genuine secret is what trips this.
          ./gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --no-banner \
            --verbose

      - name: Summary
        if: always()
        run: echo "Secret scan complete — a finding fails this job." >> "$GITHUB_STEP_SUMMARY"

name: Security

# Secret scanning (#923). Blocks the build if a real secret is ever committed —
# the backstop for the close calls this repo has had (an APK in history, .env
# handling). The Supabase anon key is allowlisted in .gitleaks.toml (public by
# design). Runs the gitleaks CLI directly (MIT-licensed) — no marketplace action,
# no licence key, no recurring cost.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # Scan the working tree (current files), not full history — catches any
          # secret present now without failing forever on old commits. --redact
          # keeps any match out of the logs.
          #
          # NON-BLOCKING for now (|| true): the anon-key allowlist in .gitleaks.toml
          # hasn't been validated on a real run (couldn't run gitleaks locally — the
          # dev network MITMs TLS). Once ONE run shows 0 findings, flip to blocking by
          # replacing the line below with:  --exit-code 1  and dropping "|| true".
          ./gitleaks dir . --config .gitleaks.toml --redact --exit-code 0 --verbose || true
          echo "Secret scan complete — review any findings above." >> "$GITHUB_STEP_SUMMARY"

# Dependabot — keeps GitHub Actions and npm packages up to date automatically.
# Opens PRs when new versions are available; CI gates the merge.
version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # ── npm packages ──────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns: ["expo*", "@expo/*"]
      supabase:
        patterns: ["@supabase/*"]
      react-native:
        patterns: ["react-native*", "@react-native*"]
    ignore:
      # These are PINNED by the Expo SDK — upgrade them via an SDK bump
      # (`expo install --fix`), never à la carte. Dependabot bumping them
      # individually causes version mismatches that break the build.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "@react-native*"
      # TypeScript majors can surface a wall of new type errors — do them by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is The Gruvs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Gruvs is South Africa's #1 nightlife and events discovery app. It lets you find Gruvs (events), concerts, food festivals, and club nights near you, RSVP with a Pass, Touch Down (check in) at the venue, and connect with Vibers who share your taste."
          }
        },
        {
          "@type": "Question",
          "name": "How do I find events near me on The Gruvs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open The Gruvs app and tap 'Scout' at the bottom. You'll see Gruvs happening near you filtered by your city, vibe, and musical taste. You can also search by genre, date, or venue."
          }
        },
        {
          "@type": "Question",
          "name": "Is The Gruvs free to download?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, The Gruvs is completely free to download on iOS and Android. Core discovery features, Vibing (RSVPs), and Touch Down check-ins are all free. Premium Passes for paid events are purchased separately."
          }
        },
        {
          "@type": "Question",
          "name": "What cities does The Gruvs cover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Gruvs covers all major South African cities including Johannesburg, Cape Town, Durban, Pretoria, Port Elizabeth, Bloemfontein, East London, Nelspruit, and Polokwane. New cities are added regularly."
          }
        },
        {
          "@type": "Question",
          "name": "How do I host an event on The Gruvs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Create a business profile on The Gruvs, then use the Biz Hub to list your Gruv, set Passes (tickets), and run Missions (ad campaigns) to reach Vibers in your target Crowd. The Gruvs provides a full Storefront and analytics dashboard."
          }
        },
        {
          "@type": "Question",
          "name": "What types of events are on The Gruvs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Gruvs features music concerts (Amapiano, Afrobeats, House, Hip-hop), nightclub events, food festivals, pop-up markets, comedy shows, fashion events, art exhibitions, sports events, and community Gruvs across South Africa."
          }
        },
        {
          "@type": "Question",
          "name": "How does The Gruvs ad platform work for businesses?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Businesses on The Gruvs can launch Missions (ad campaigns) that reach Vibers at three Gruv phases: Pre-Gruv (before the event), In the Gruv (during), and Post-Gruv (after). The advanced Crowd targeting engine uses over 3,000 Vibe signals including demographics, music taste, spending level, and location."
          }
        },
        {
          "@type": "Question",
          "name": "What is 'Touch Down' on The Gruvs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Touch Down is The Gruvs' check-in feature. When you arrive at a Gruv, you Touch Down to confirm your attendance, connect with other Vibers at the event, and unlock exclusive In the Gruv content and offers."
          }
        }
      ]
    }
    </script>

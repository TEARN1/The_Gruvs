<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>The Gruvs</title>
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; padding: 0; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; width: 100%; flex: 1; }
    </style>
    <style>
      /* Dark background fills entire viewport — no white edges */
      html, body {
        background-color: #0d1112 !important;
        width: 100%;
        max-width: 100%;
        /* Use dvh so the viewport excludes browser toolbars on mobile */
        height: 100dvh;
        max-height: 100dvh;
      }
      #root {
        background-color: #0d1112;
        width: 100%;
        max-width: 100%;
        /* Fill exactly the visible viewport — no content hidden behind browser UI */
        height: 100dvh;
        max-height: 100dvh;
        /* Respect device safe areas (notch, home indicator, nav bar) */
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        box-sizing: border-box;
      }

      /* Hide all scrollbars globally */
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
    <meta name="theme-color" content="#0d1112">
    <meta name="description" content="Discover your next event. I got you.">
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>

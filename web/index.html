<!DOCTYPE html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Viewport: maximum-scale=1 prevents iOS auto-zoom on inputs (audit #24) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, shrink-to-fit=no, viewport-fit=cover" />
    <title>The Gruvs — Discover Your Next Event</title>

    <!-- SEO & Social (audit #18, #57, #58) -->
    <meta name="description" content="The Gruvs — the ultimate event discovery platform. Find gruvs near you, connect with vibers, hire services, and ride the vibe economy." />
    <meta name="keywords" content="events, discover, gruvs, vibers, nightlife, music, party, food, culture, South Africa" />
    <meta name="author" content="The Gruvs" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://the-gruvs-pt23.vercel.app" />

    <!-- Open Graph (audit #18) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Gruvs — Discover Your Next Event" />
    <meta property="og:description" content="Find the best local events — from music and nightlife to food and culture. Connect with vibers near you." />
    <meta property="og:url" content="https://the-gruvs-pt23.vercel.app" />
    <meta property="og:site_name" content="The Gruvs" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Gruvs — Discover Your Next Event" />
    <meta name="twitter:description" content="Find the best local events — from music and nightlife to food and culture." />

    <!-- PWA & Mobile (audit #11, #34, #74, #75) -->
    <meta name="theme-color" content="#0d1112" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Gruvs" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#0d1112" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Referrer policy (audit #101) -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Preconnect for speed (audit #33) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Modern font stack (audit #2) — Inter for premium app feel -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Critical CSS: prevents FOUC, improves FCP, Opera Mini compat -->
    <style id="expo-reset">
      /* Full-height body (react-native-web) */
      html, body { height: 100%; margin: 0; padding: 0; }
      body { overflow: hidden; background-color: #0d1112; color: #fff; }
      #root { display: flex; height: 100%; flex: 1; }

      /* Modern font stack (audit #2, #13) */
      body, input, textarea, button, select {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* Prevent iOS zoom on inputs (audit #24) */
      input, textarea, select { font-size: 16px !important; }

      /* Custom scrollbar for dark theme (audit #47) */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,242,255,0.2); border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,242,255,0.4); }

      /* Focus states for accessibility (audit #25) */
      *:focus-visible {
        outline: 2px solid #00f2ff;
        outline-offset: 2px;
      }

      /* Prevent accidental text selection on UI elements (audit #60) */
      [role="button"], button { user-select: none; -webkit-user-select: none; cursor: pointer; }

      /* Overscroll containment (audit #108) */
      html { overscroll-behavior-y: contain; }

      /* Safe area insets for notched devices (audit #75) */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /* Reduced motion for accessibility (audit #48) */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Reduced transparency fallback (audit #162) */
      @media (prefers-reduced-transparency: reduce) {
        .glass-view { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
      }

      /* Opera Mini / low-end browser fallback */
      @supports not (display: flex) {
        #root { display: block; }
      }

      /* Loading shimmer for skeleton screens */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.8s ease-in-out infinite;
      }
    </style>
  </head>

  <body>
    <!-- Fallback for Opera Mini and noscript browsers -->
    <noscript>
      <div style="background:#0d1112;color:#00f2ff;text-align:center;padding:40px 20px;font-family:sans-serif;">
        <h1 style="font-size:24px;margin-bottom:12px;">The Gruvs</h1>
        <p style="color:#ccc;font-size:14px;">Discover your next event. Enable JavaScript to use The Gruvs.</p>
      </div>
    </noscript>
    <!-- Root element -->
    <div id="root"></div>
  </body>
</html>

    <!-- PWA & Mobile -->
    <meta name="theme-color" content="#0d1112" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Gruvs" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Item 21: color-scheme — browser controls (scrollbars, inputs) adopt theme -->
    <meta name="color-scheme" content="dark light" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Item 20: preload heaviest-used Inter weights to eliminate FOUT -->
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiJ-Ek-_EeA.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuI6fAZ9hiJ-Ek-_EeA.woff2" as="font" type="font/woff2" crossorigin />

    <style id="expo-reset">
      /* ── Items 1-5: CSS Custom Properties (design tokens) ─────────────────── */
      :root {
        --color-primary:  #00f2ff;
        --color-bg:       #0d1112;
        --color-text:     #ffffff;
        --color-surface:  #131a1c;
        --color-muted:    rgba(255,255,255,0.55);
        --color-glow:     #00f2ff;
        --color-accent:   #b8c1c2;
        --color-border:   rgba(255,255,255,0.15);

        --radius-card:  22px;
        --radius-pill:  20px;
        --radius-btn:   14px;
        --radius-badge: 8px;
        --radius-glass: 18px;

        --shadow-card: 0 12px 40px rgba(0,0,0,0.6);
        --shadow-glow: 0 0 25px color-mix(in srgb, var(--color-glow) 60%, transparent);
        --shadow-lift: 0 20px 60px rgba(0,0,0,0.75);

        --transition-fast:   150ms ease;
        --transition-base:   220ms ease;
        --transition-slow:   380ms ease;
        --transition-spring: cubic-bezier(0.34,1.56,0.64,1);

        --z-toast:   99999;
        --z-modal:   9000;
        --z-sidebar: 800;
        --z-fab:     600;
        --z-sticky:  100;
      }

      /* Item 16: Static light-mode fallback (overridden by ThemeContext injection) */
      @media (prefers-color-scheme: light) {
        :root {
          --color-bg:      #f0f4f5;
          --color-surface: #e4e8e9;
          --color-text:    #0d1112;
          --color-muted:   rgba(13,17,18,0.55);
        }
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      body {
        background-color: #0d1112;
        color: #fff;
        /* Removed overflow: hidden to support native browser behavior. Scrolling handled by ScrollView. */
      }
      #root {
        display: flex;
        flex: 1;
        height: 100%;
      }

      body, input, textarea, button, select {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      input, textarea, select { font-size: 16px !important; }

      /* Item 6: Brand-coloured text selection */
      ::selection { background-color: rgba(0,242,255,0.25); color: #fff; }

      /* Item 7: Prevent text orphans in headings and paragraphs */
      h1, h2, h3, h4, h5, h6 { text-wrap: balance; }
      p, li, label { text-wrap: pretty; }

      /* Item 15: Brand-coloured text cursor in inputs */
      textarea, input { caret-color: var(--color-primary, #00f2ff); }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,242,255,0.2); border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,242,255,0.4); }

      *:focus-visible {
        outline: 2px solid #00f2ff;
        outline-offset: 2px;
      }

      [role="button"], button { user-select: none; -webkit-user-select: none; cursor: pointer; }

      html { overscroll-behavior-y: contain; }

      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /* Item 8: Defer off-screen image/video rendering */
      img, video {
        content-visibility: auto;
        contain-intrinsic-size: 0 200px;
      }

      /* Item 9: Event card hover lift */
      .event-card {
        transition: transform var(--transition-base), box-shadow var(--transition-base);
        cursor: pointer;
      }
      @media (hover: hover) {
        .event-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift); }
        /* Item 63: Hero card hover */
        .hero-card:hover { transform: scale(1.01); box-shadow: var(--shadow-lift); }
        /* Item 68: Category cell hover */
        .category-cell:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
      }

      /* Item 10: Pointer-only opacity feedback on interactive elements */
      @media (hover: hover) {
        [role="button"]:hover, button:hover { opacity: 0.88; }
      }

      /* Item 17: Glassmorphic sticky filter bar */
      .sticky-filter-bar {
        position: sticky;
        top: 0;
        z-index: var(--z-sticky, 100);
        backdrop-filter: blur(12px) saturate(1.5);
        -webkit-backdrop-filter: blur(12px) saturate(1.5);
        background-color: rgba(13,17,18,0.85);
      }

      /* Item 18: Optional scroll-snap classes */
      .scroll-snap-list {
        scroll-snap-type: y mandatory;
        scroll-padding-top: 60px;
      }
      .scroll-snap-item { scroll-snap-align: start; }

      /* Item 39: CSS tooltip for collapsed sidebar items */
      [data-tooltip] { position: relative; }
      [data-tooltip]:hover::after {
        content: attr(data-tooltip);
        position: absolute;
        left: calc(100% + 10px);
        top: 50%;
        transform: translateY(-50%);
        background: rgba(13,17,18,0.95);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        pointer-events: none;
        z-index: var(--z-sidebar, 800);
      }

      /* Item 40: Skip-to-content link (visible on focus) */
      #skip-to-content {
        position: absolute;
        top: -100px;
        left: 8px;
        z-index: var(--z-toast, 99999);
        background: var(--color-primary, #00f2ff);
        color: #000;
        padding: 8px 16px;
        border-radius: var(--radius-btn, 14px);
        font-weight: 900;
        font-size: 13px;
        transition: top var(--transition-fast);
      }
      #skip-to-content:focus { top: 8px; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        .glass-view { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
      }

      @supports not (display: flex) {
        #root { display: block; }
      }

      /* Item 11: Print styles */
      @media print {
        body { background: #fff !important; color: #000 !important; }
        .tab-bar, .sidebar, .ad-flywheel { display: none !important; }
        .event-card { border: 1px solid #ccc !important; break-inside: avoid; }
        img { max-width: 100% !important; }
      }

      /* ── Keyframe animations ──────────────────────────────────────────────── */

      @keyframes shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.8s ease-in-out infinite;
      }

      /* Item 12: Staggered reveal for list items */
      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0);    }
      }
      .fade-slide-up {
        animation: fadeSlideUp var(--transition-slow) var(--transition-spring) both;
      }

      /* Item 13: Ambient badge glow */
      @keyframes pulseGlow {
        0%,  100% { box-shadow: 0 0 10px color-mix(in srgb, var(--color-glow, #00f2ff) 40%, transparent); }
        50%        { box-shadow: 0 0 28px color-mix(in srgb, var(--color-glow, #00f2ff) 90%, transparent); }
      }
      .badge-glow { animation: pulseGlow 2.4s ease-in-out infinite; }

      /* Item 14: View Transitions API — tab crossfade */
      @supports (view-transition-name: root) {
        @keyframes vt-fade-out { to   { opacity: 0; } }
        @keyframes vt-fade-in  { from { opacity: 0; } }
        ::view-transition-old(root) { animation: 120ms ease out both vt-fade-out; }
        ::view-transition-new(root) { animation: 180ms ease in  both vt-fade-in;  }
      }

      /* Item 19: Toast entrance animation */
      @keyframes toastIn {
        from { opacity: 0; transform: translateY(-16px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0)     scale(1);    }
      }
      .toast-enter { animation: toastIn 220ms var(--transition-spring) both; }
    </style>
  </head>

  <body>

      <div style="background:#0d1112;color:#00f2ff;text-align:center;padding:40px 20px;font-family:sans-serif;">
        <h1 style="font-size:24px;margin-bottom:12px;">The Gruvs</h1>
        <p style="color:#ccc;font-size:14px;">Discover your next event. Enable JavaScript to use The Gruvs.</p>
      </div>

    <div id="root"></div>
    <!-- Item 22: Enable smooth scroll before React hydrates -->
    <script>document.documentElement.style.scrollBehavior='smooth';</script>

</html>
